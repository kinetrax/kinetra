[build]
  # Build command - generates config.js from environment variables
  command = "npm run config"
  
  # Publish directory - Netlify will serve files from root
  publish = "."

[build.environment]
  # Node.js version (Netlify will use this)
  NODE_VERSION = "18"

 # Exclude config.js from secrets scanning (it's expected to contain tokens)
  SECRETS_SCAN_OMIT_PATHS = "js/config.js"

# Cache policy:
# - HTML is never cached (always fetch latest page shell)
# - CSS/JS must revalidate (users get new deploy assets without hard refresh)
# - images/fonts stay aggressively cached for performance

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
